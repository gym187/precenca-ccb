services:
  db:
    image: mariadb:10.11
    container_name: ccb_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ccb
      MYSQL_USER: ${DB_USER:-ccb_user}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    # ports:
    #   - "3307:3306"  # Descomente apenas para debug local
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - internal
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  app:
    build: .
    container_name: ccb_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://${DB_USER:-ccb_user}:${DB_PASSWORD}@db:3306/ccb
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      PORT: 3000
      NODE_ENV: production
    volumes:
      - uploads_data:/app/uploads
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
    container_name: ccb_frontend
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "8080:80"
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  db_data:
  uploads_data:

networks:
  internal:
    driver: bridge
