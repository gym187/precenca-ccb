server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy para o backend (evita CORS)
    location /api/ {
        proxy_pass         http://app:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 90;
    }

    # Proxy para uploads (fotos)
    location ^~ /uploads/ {
        proxy_pass         http://app:3000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # Service worker — nunca pode ser cacheado pelo HTTP
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # Manifesto PWA — sempre revalidar (URLs dos icones nao tem hash)
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache, must-revalidate";
        expires 0;
    }

    # Icones PWA (URLs estaveis, sem hash) — sempre revalidar
    location ~ ^/(pwa-192|pwa-512|icon-source)\.(png|svg)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        expires 0;
    }

    # index.html — sempre revalidar para puxar nova build
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        expires 0;
    }

    # Assets hashados do Vite — imutaveis (URL muda quando conteudo muda)
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Demais assets estaticos (fontes etc) — cache longo mas revalidavel
    location ~* \.(js|css|jpg|jpeg|gif|ico|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

